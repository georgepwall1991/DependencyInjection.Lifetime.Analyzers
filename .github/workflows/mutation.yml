name: Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - stryker-config.json
          - stryker-config.helpers.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Run the 80% mutation gate
        run: pwsh ./scripts/Invoke-MutationTests.ps1 -ConfigFile ${{ matrix.config }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: StrykerOutput
          retention-days: 7
